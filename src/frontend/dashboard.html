<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dashboard - Dynamic FAQ Builder</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .dashboard-nav { display: flex; gap: 15px; margin-bottom: 30px; }
    .nav-button { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
    .nav-button:hover { opacity: 0.9; }
    .nav-button.secondary { background: #6b7280; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stat-number { font-size: 2em; font-weight: bold; color: var(--accent); }
    .stat-label { color: var(--muted); font-size: 0.9em; }
    .content-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .faq-list { margin-top: 20px; }
    .faq-item { padding: 15px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; }
    .faq-question { font-weight: 600; margin-bottom: 8px; }
    .faq-answer { color: var(--muted); font-size: 0.9em; margin-bottom: 10px; }
    .faq-meta { display: flex; gap: 15px; font-size: 0.8em; color: var(--muted); }
    .faq-actions { margin-top: 10px; }
    .btn-small { padding: 5px 10px; font-size: 0.8em; margin-right: 5px; }
    .search-result-item { padding: 15px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; background: white; }
    .search-result-header { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .search-result-header:hover { background: #f9fafb; }
    .expand-arrow { display: inline-block; min-width: 20px; text-align: center; font-size: 0.9em; color: #6b7280; transition: transform 0.2s; }
    .search-result-question { flex: 1; font-weight: 600; }
    .search-result-answer { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; color: var(--muted); }
    .rating-container { white-space: nowrap; display: flex; align-items: center; gap: 8px; }
    .rating-dropdown { padding: 4px 8px; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 0.85em; }
    .search-box { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; }
    .role-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
    .role-admin { background: #fef3c7; color: #92400e; }
    .role-editor { background: #dbeafe; color: #1e40af; }
    .role-viewer { background: #f3f4f6; color: #374151; }
    .hidden { display: none; }
    .nav-button.active { background: #065f46; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
        <h1 id="welcome">Dashboard</h1>
      <div>
        <span id="role-badge" class="role-badge"></span>
        <button id="logout" class="nav-button secondary">Logout</button>
      </div>
    </div>

    <div class="dashboard-nav">
      <button id="nav-faqs" class="nav-button">FAQs</button>
      <button id="nav-my-answers" class="nav-button">My Answered Questions</button>
      <button id="nav-search" class="nav-button">Search</button>
      <button id="nav-admin" class="nav-button hidden">Admin Panel</button>
    </div>

    <!-- FAQ Management Section -->
    <div id="faqs-section" class="content-section">
      <h2>FAQ Management</h2>
      
      <!-- Submit Question Form -->
      <div style="background: #f9fafb; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e5e7eb;">
        <h3 style="margin-bottom: 15px;">Submit a Question</h3>
        <form id="submit-question-form" style="display: flex; flex-direction: column; gap: 12px;">
          <textarea id="question-input" name="question" class="form-control" required placeholder="Enter your question..." style="min-height: 100px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;"></textarea>
          <button type="submit" class="nav-button" id="submit-question-btn" style="align-self: flex-start;">Submit Question</button>
          <p id="submit-msg" style="margin: 0; display: none;"></p>
        </form>
      </div>

      <!-- FAQ List removed by request -->
    </div>

    <!-- Search Section -->
    <div id="search-section" class="content-section hidden">
      <h2>Search FAQs</h2>
      <input type="text" id="search-input" class="search-box" placeholder="Search questions and answers...">
      <div class="faq-list" id="search-results">
        <p class="muted">Enter a search term to find FAQs</p>
      </div>
    </div>

    <!-- My Answered Questions Section -->
    <div id="my-answers-section" class="content-section hidden">
      <h2>My Answered Questions</h2>
      <div class="faq-list" id="my-answers-list">
        <p class="muted">Loading your answered questions...</p>
      </div>
    </div>

    <!-- Admin Panel Section -->
    <div id="admin-section" class="content-section hidden">
      <h2>Admin Panel</h2>
      <div class="dashboard-nav">
        <button id="admin-users" class="nav-button">Manage Users</button>
        <button id="admin-categories" class="nav-button">Manage Categories</button>
        <button id="admin-audit" class="nav-button">Audit Log</button>
      </div>
      <div id="admin-content">
        <p class="muted">Select an admin function above</p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/faq.js"></script>
  <script>
    let currentUser = null;
    let currentSection = 'overview';

    async function init() {
      const token = localStorage.getItem('token');
      if (!token) return window.location.href = 'login.html';
      
      const me = await meReq(token);
      if (!me || !me.user) {
        localStorage.removeItem('token');
        return window.location.href = 'login.html';
      }
      
      currentUser = me.user;
      document.getElementById('welcome').textContent = `Welcome, ${currentUser.name}`;
      
      // Set role badge
      const roleBadge = document.getElementById('role-badge');
      roleBadge.textContent = currentUser.role.toUpperCase();
      roleBadge.className = `role-badge role-${currentUser.role}`;
      
      // Show/hide admin features
      if (currentUser.role === 'admin') {
        document.getElementById('nav-admin').classList.remove('hidden');
      }
      
      // Load initial data
      setupEventListeners();
    }

    function setupEventListeners() {
      // Navigation
      document.getElementById('nav-faqs').addEventListener('click', () => showSection('faqs'));
      document.getElementById('nav-search').addEventListener('click', () => showSection('search'));
      document.getElementById('nav-my-answers').addEventListener('click', () => showSection('my-answers'));
      document.getElementById('nav-admin').addEventListener('click', () => showSection('admin'));
      
      // Admin navigation
      document.getElementById('admin-users').addEventListener('click', () => loadAdminUsers());
      document.getElementById('admin-categories').addEventListener('click', () => loadAdminCategories());
      document.getElementById('admin-audit').addEventListener('click', () => loadAdminAudit());
      
      // FAQ management
      document.getElementById('search-input').addEventListener('input', debounce(performSearch, 300));
      
      // Submit question form
      document.getElementById('submit-question-form').addEventListener('submit', submitQuestion);
      
      // Logout
      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      });
    }

    function showSection(section) {
      // Hide all sections
      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-button').forEach(el => el.classList.remove('active'));
      
      // Show selected section
      const sectionEl = document.getElementById(`${section}-section`);
      if (sectionEl) {
        sectionEl.classList.remove('hidden');
      } else {
        console.error(`Section ${section}-section not found`);
      }
      
      const navBtn = document.getElementById(`nav-${section}`);
      if (navBtn) {
        navBtn.classList.add('active');
      }
      
      currentSection = section;
      
      // Load section-specific data
      // (faqs): no FAQ list to load; showing only the submit form
      if (section === 'search') {
        // If we have cached search results, refresh the ratings before displaying
        if (searchCache.results && searchCache.results.length > 0) {
          reloadSearchResultsWithUpdatedRatings();
        } else {
          document.getElementById('search-results').innerHTML = '<p class="muted">Enter a search term to find FAQs</p>';
        }
      }
      if (section === 'my-answers') loadMyAnsweredQuestions();
    }

    async function reloadSearchResultsWithUpdatedRatings() {
      // Fetch latest ratings for cached results
      const results = searchCache.results;
      const userRatings = {};
      try {
        for (const item of results) {
          const response = await fetch(`/api/feedback?faq_id=${item.id}&feedback_type=rating`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
          });
          if (response.ok) {
            const data = await response.json();
            const userRating = data.feedback.find(f => f.user_id === currentUser.id);
            if (userRating) {
              userRatings[item.id] = userRating.rating;
            }
          }
        }
      } catch (error) {
        console.error('Error fetching updated ratings:', error);
      }
      
      // Update cache with new ratings
      searchCache.ratings = userRatings;
      
      // Re-render with updated ratings
      const container = document.getElementById('search-results');
      container.innerHTML = results.map((item, index) => {
        const userRating = userRatings[item.id] ? String(userRatings[item.id]) : '';
        
        return `
        <div class="faq-item" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 15px;">
          <div style="flex: 1; cursor: pointer;" onclick="toggleAnswer(${index})">
            <div class="faq-question">${item.question}</div>
            <div id="answer-${index}" class="faq-answer" style="display: none; margin-top: 10px;">
              <strong>Answer:</strong> ${item.answer}
            </div>
            <div class="faq-meta" style="margin-top: 8px;">
              <span>Category: ${item.category_name || 'Uncategorized'}</span>
              <span>Created: ${new Date(item.created_at).toLocaleDateString()}</span>
            </div>
          </div>
          <div style="white-space: nowrap;">
            <label style="font-size: 0.9em; color: #6b7280; display: block; margin-bottom: 5px;">Rate:</label>
            <div style="display: flex; gap: 8px;">
              <select id="rating-select-${item.id}" class="rating-select" style="padding: 6px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.95em;">
                <option value="" ${userRating === '' ? 'selected' : ''}>Not rated</option>
                <option value="1" ${userRating === '1' ? 'selected' : ''}>1</option>
                <option value="2" ${userRating === '2' ? 'selected' : ''}>2</option>
                <option value="3" ${userRating === '3' ? 'selected' : ''}>3</option>
                <option value="4" ${userRating === '4' ? 'selected' : ''}>4</option>
                <option value="5" ${userRating === '5' ? 'selected' : ''}>5</option>
              </select>
              <button onclick="const sel = document.getElementById('rating-select-${item.id}'); submitRating(${item.id}, sel.value, sel)" style="padding: 6px 12px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em;">Save</button>
            </div>
          </div>
        </div>
      `}).join('');
    }


    async function loadFAQs() {
      try {
        // If FAQ list container is not present, skip loading
        if (!document.getElementById('faq-list')) return;

        const response = await fetch('/api/faq', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        if (response.ok) {
          const data = await response.json();
          displayFAQs(data.faqs);
        } else {
          console.error('Failed to load FAQs:', response.status, response.statusText);
          const list = document.getElementById('faq-list');
          if (list) list.innerHTML = '<p class="muted">No FAQs available</p>';
        }
      } catch (error) {
        console.error('Error loading FAQs:', error);
        const list = document.getElementById('faq-list');
        if (list) list.innerHTML = '<p class="muted">Error loading FAQs: ' + error.message + '</p>';
      }
    }

    function displayFAQs(faqs) {
      const container = document.getElementById('faq-list');
      
      if (faqs.length === 0) {
        container.innerHTML = '<p class="muted">No FAQs found</p>';
        return;
      }
      
      container.innerHTML = faqs.map(faq => `
        <div class="faq-item">
          <div class="faq-question">${faq.question}</div>
          <div class="faq-answer">${faq.answer.substring(0, 100)}${faq.answer.length > 100 ? '...' : ''}</div>
          <div class="faq-meta">
            <span>Category: ${faq.category_name || 'Uncategorized'}</span>
            <span>Status: ${faq.status}</span>
            <span>Views: ${faq.view_count}</span>
            <span>Author: ${faq.author_name}</span>
          </div>
          <div class="faq-actions">
            <button class="btn-small nav-button" onclick="viewFAQ(${faq.id})">View</button>
            ${canEdit(faq) ? `<button class="btn-small nav-button secondary" onclick="editFAQ(${faq.id})">Edit</button>` : ''}
            ${canDelete(faq) ? `<button class="btn-small nav-button secondary" onclick="deleteFAQ(${faq.id})">Delete</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function canEdit(faq) {
      return currentUser.role === 'admin' || (currentUser.role === 'editor' && faq.author_id === currentUser.id);
    }

    function canDelete(faq) {
      return currentUser.role === 'admin';
    }

    // Cache for search results and ratings
    let searchCache = {
      results: [],
      ratings: {}
    };

    async function performSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) {
        document.getElementById('search-results').innerHTML = '<p class="muted">Enter a search term to find FAQs</p>';
        return;
      }
      
      try {
        // First try Lunr search
        const API_BASE = (window && window.location && window.location.protocol === 'file:') 
          ? 'http://localhost:3000' 
          : (window && window.location && window.location.origin) ? window.location.origin : 'http://localhost:3000';
        
        let response = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}`, {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        let data = { results: [] };
        
        if (response.ok) {
          data = await response.json();
        }
        
        // If Lunr returns no results or few results, try database search with LIKE
        if (!data.results || data.results.length === 0) {
          response = await fetch(`${API_BASE}/api/faq`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
          });
          
          if (response.ok) {
            const allFaqs = await response.json();
            const searchTerm = query.toLowerCase();
            data.results = allFaqs.faqs.filter(faq => 
              faq.status === 'published' && (
                faq.question.toLowerCase().includes(searchTerm) ||
                faq.answer.toLowerCase().includes(searchTerm)
              )
            );
          }
        }
        
        displaySearchResults(data.results);
      } catch (error) {
        console.error('Error searching FAQs:', error);
        document.getElementById('search-results').innerHTML = '<p class="muted">Error searching FAQs</p>';
      }
    }

    async function displaySearchResults(results) {
      const container = document.getElementById('search-results');
      
      if (!results || results.length === 0) {
        container.innerHTML = '<p class="muted">No FAQs found matching your search</p>';
        return;
      }
      
      // Fetch user ratings for all FAQs
      const userRatings = {};
      try {
        for (const item of results) {
          const response = await fetch(`/api/feedback?faq_id=${item.id}&feedback_type=rating`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
          });
          if (response.ok) {
            const data = await response.json();
            // Find current user's rating for this FAQ
            const userRating = data.feedback.find(f => f.user_id === currentUser.id);
            if (userRating) {
              userRatings[item.id] = userRating.rating;
            }
          }
        }
      } catch (error) {
        console.error('Error fetching user ratings:', error);
      }
      
      // Cache the results and ratings
      searchCache.results = results;
      searchCache.ratings = userRatings;
      
      container.innerHTML = results.map((item, index) => {
        const userRating = userRatings[item.id] ? String(userRatings[item.id]) : '';
        const ratingOptions = ['', '1', '2', '3', '4', '5'];
        
        return `
        <div class="faq-item" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 15px;">
          <div style="flex: 1; cursor: pointer;" onclick="toggleAnswer(${index})">
            <div class="faq-question">${item.question}</div>
            <div id="answer-${index}" class="faq-answer" style="display: none; margin-top: 10px;">
              <strong>Answer:</strong> ${item.answer}
            </div>
            <div class="faq-meta" style="margin-top: 8px;">
              <span>Category: ${item.category_name || 'Uncategorized'}</span>
              <span>Created: ${new Date(item.created_at).toLocaleDateString()}</span>
            </div>
          </div>
          <div style="white-space: nowrap;">
            <label style="font-size: 0.9em; color: #6b7280; display: block; margin-bottom: 5px;">Rate: <span id="rating-display-${item.id}" style="font-weight: 600; color: #1f2937;">${userRating ? userRating : 'Not rated'}</span></label>
            <div style="display: flex; gap: 8px;">
              <select id="rating-select-${item.id}" class="rating-select" onchange="document.getElementById('rating-display-${item.id}').textContent = this.value || 'Not rated'" style="padding: 6px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.95em;">
                <option value="" ${userRating === '' ? 'selected' : ''}>Not rated</option>
                <option value="1" ${userRating === '1' ? 'selected' : ''}>1</option>
                <option value="2" ${userRating === '2' ? 'selected' : ''}>2</option>
                <option value="3" ${userRating === '3' ? 'selected' : ''}>3</option>
                <option value="4" ${userRating === '4' ? 'selected' : ''}>4</option>
                <option value="5" ${userRating === '5' ? 'selected' : ''}>5</option>
              </select>
              <button onclick="const sel = document.getElementById('rating-select-${item.id}'); submitRating(${item.id}, sel.value, sel)" style="padding: 6px 12px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em;">Save</button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    function toggleAnswer(index, containerId) {
      if (containerId) {
        // For "My Answered Questions" - find the parent container and toggle the answer
        const container = document.getElementById(containerId);
        const items = container.querySelectorAll('.search-result-item');
        if (items[index]) {
          const answerDiv = items[index].querySelector('.search-result-answer');
          const arrow = items[index].querySelector('.expand-arrow');
          if (answerDiv) {
            const isHidden = answerDiv.style.display === 'none';
            answerDiv.style.display = isHidden ? 'block' : 'none';
            if (arrow) {
              arrow.textContent = isHidden ? '▼' : '▶';
            }
          }
        }
      } else {
        // For search results - use the old method
        const answerEl = document.getElementById(`answer-${index}`);
        if (answerEl) {
          answerEl.style.display = answerEl.style.display === 'none' ? 'block' : 'none';
        }
      }
    }

    async function submitRating(faqId, rating, selectElement) {
      if (!rating) {
        alert('Please select a rating');
        return;
      }
      
      try {
        const payload = {
          faq_id: faqId,
          feedback_type: 'rating',
          content: rating + ' stars',
          rating: parseInt(rating)
        };
        
        const response = await fetch('/api/feedback', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify(payload)
        });
        
        if (response.ok) {
          const result = await response.json();
          console.log('Rating saved successfully:', result);
          alert(`Thank you for rating! Your rating of ${rating} star(s) has been saved.`);
          // Keep the select element value and update display
          if (selectElement) {
            selectElement.value = rating;
            // Force dropdown to show the selected value
            for (let option of selectElement.options) {
              option.selected = (option.value === rating);
            }
          }
          // Update the rating display
          const displayElement = document.getElementById(`rating-display-${faqId}`);
          if (displayElement) {
            displayElement.textContent = rating || 'Not rated';
          }
          // Update cache
          searchCache.ratings[faqId] = parseInt(rating);
        } else {
          const err = await response.json();
          console.error('Error response:', err);
          alert('Failed to submit rating: ' + (err.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error submitting rating:', error);
        alert('Error submitting rating: ' + error.message);
      }
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    async function loadMyAnsweredQuestions() {
      try {
        const response = await fetch('/api/faq', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        if (response.ok) {
          const data = await response.json();
          displayMyAnsweredQuestions(data.faqs);
        } else {
          document.getElementById('my-answers-list').innerHTML = '<p class="muted">Error loading answered questions</p>';
        }
      } catch (error) {
        console.error('Error loading answered questions:', error);
        document.getElementById('my-answers-list').innerHTML = '<p class="muted">Error loading answered questions: ' + error.message + '</p>';
      }
    }

    async function displayMyAnsweredQuestions(faqs) {
      const container = document.getElementById('my-answers-list');
      
      // Filter to show only published questions asked by current user
      const myAnsweredFaqs = faqs.filter(faq => faq.status === 'published' && faq.author_id === currentUser.id);
      
      if (myAnsweredFaqs.length === 0) {
        container.innerHTML = '<p class="muted">No answered questions yet. Your answered questions will appear here.</p>';
        return;
      }
      
      // Fetch user ratings for all FAQs
      const userRatings = {};
      try {
        for (const faq of myAnsweredFaqs) {
          const response = await fetch(`/api/feedback?faq_id=${faq.id}&feedback_type=rating`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
          });
          if (response.ok) {
            const data = await response.json();
            // Find current user's rating for this FAQ
            const userRating = data.feedback.find(f => f.user_id === currentUser.id);
            if (userRating) {
              userRatings[faq.id] = userRating.rating;
            }
          }
        }
      } catch (error) {
        console.error('Error fetching user ratings:', error);
      }
      
      container.innerHTML = myAnsweredFaqs.map((faq, index) => {
        const userRating = userRatings[faq.id] ? String(userRatings[faq.id]) : '';
        return `
        <div class="search-result-item">
          <div class="search-result-header" onclick="toggleAnswer(${index}, 'my-answers-list')">
            <span class="expand-arrow">▶</span>
            <span class="search-result-question">${faq.question}</span>
            <div class="rating-container">
              <select id="rating-select-my-${faq.id}" class="rating-dropdown" onclick="event.stopPropagation();" style="padding: 6px 8px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 0.9em;">
                <option value="" ${userRating === '' ? 'selected' : ''}>Not rated</option>
                <option value="1" ${userRating === '1' ? 'selected' : ''}>1</option>
                <option value="2" ${userRating === '2' ? 'selected' : ''}>2</option>
                <option value="3" ${userRating === '3' ? 'selected' : ''}>3</option>
                <option value="4" ${userRating === '4' ? 'selected' : ''}>4</option>
                <option value="5" ${userRating === '5' ? 'selected' : ''}>5</option>
              </select>
              <button onclick="const sel = document.getElementById('rating-select-my-${faq.id}'); submitRating(${faq.id}, sel.value, sel)" style="padding: 6px 10px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85em;">Save</button>
            </div>
          </div>
          <div class="search-result-answer" style="display: none;">
            <div><strong>Answer:</strong> ${faq.answer}</div>
            <div class="faq-meta">
              <span>Answered: ${new Date(faq.updated_at || faq.created_at).toLocaleDateString()}</span>
              <span>Category: ${faq.category_name || 'Uncategorized'}</span>
            </div>
          </div>
        </div>
      `}).join('');
    }

    async function submitQuestion(e) {
      e.preventDefault();
      const questionInput = document.getElementById('question-input');
      const submitBtn = document.getElementById('submit-question-btn');
      const submitMsg = document.getElementById('submit-msg');
      const question = questionInput.value.trim();

      if (!question) {
        submitMsg.textContent = 'Please enter a question';
        submitMsg.style.color = 'var(--error)';
        submitMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      submitMsg.style.display = 'none';

      try {
        const response = await fetch('/api/faq', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('token')
          },
          body: JSON.stringify({
            question: question,
            answer: 'Pending response',
            category_id: 1,
            status: 'draft'
          })
        });

        if (response.status === 201 || response.ok) {
          submitMsg.textContent = 'Question submitted successfully!';
          submitMsg.style.color = 'var(--success)';
          submitMsg.style.display = 'block';
          questionInput.value = '';
        } else {
          const err = await response.json();
          throw new Error(err.message || 'Failed to submit question');
        }
      } catch (error) {
        submitMsg.textContent = 'Error: ' + error.message;
        submitMsg.style.color = 'var(--error)';
        submitMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Question';
      }
    }
