<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dashboard - Dynamic FAQ Builder</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .dashboard-nav { display: flex; gap: 15px; margin-bottom: 30px; }
    .nav-button { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
    .nav-button:hover { opacity: 0.9; }
    .nav-button.secondary { background: #6b7280; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stat-number { font-size: 2em; font-weight: bold; color: var(--accent); }
    .stat-label { color: var(--muted); font-size: 0.9em; }
    .content-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .faq-list { margin-top: 20px; }
    .faq-item { padding: 15px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; }
    .faq-question { font-weight: 600; margin-bottom: 8px; }
    .faq-answer { color: var(--muted); font-size: 0.9em; margin-bottom: 10px; }
    .faq-meta { display: flex; gap: 15px; font-size: 0.8em; color: var(--muted); }
    .faq-actions { margin-top: 10px; }
    .btn-small { padding: 5px 10px; font-size: 0.8em; margin-right: 5px; }
    .search-box { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; }
    .role-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
    .role-admin { background: #fef3c7; color: #92400e; }
    .role-editor { background: #dbeafe; color: #1e40af; }
    .role-viewer { background: #f3f4f6; color: #374151; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
        <h1 id="welcome">Dashboard</h1>
      <div>
        <span id="role-badge" class="role-badge"></span>
        <button id="logout" class="nav-button secondary">Logout</button>
      </div>
    </div>

    <div class="dashboard-nav">
      <button id="nav-overview" class="nav-button">Overview</button>
      <button id="nav-faqs" class="nav-button">FAQs</button>
      <a href="qa.html" class="nav-button">Q/A Management</a>
      <a href="feedback.html" class="nav-button">Feedback</a>
      <button id="nav-search" class="nav-button">Search</button>
      <button id="nav-admin" class="nav-button hidden">Admin Panel</button>
    </div>

    <!-- Overview Section -->
    <div id="overview-section" class="content-section">
      <h2>Overview</h2>
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="total-faqs">-</div>
          <div class="stat-label">Total FAQs</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="published-faqs">-</div>
          <div class="stat-label">Published</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="draft-faqs">-</div>
          <div class="stat-label">Drafts</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="total-views">-</div>
          <div class="stat-label">Total Views</div>
        </div>
      </div>
    </div>

    <!-- FAQ Management Section -->
    <div id="faq-section" class="content-section hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>FAQ Management</h2>
        <button id="create-faq-btn" class="nav-button hidden">Create New FAQ</button>
      </div>
      <div class="faq-list" id="faq-list">
        <p class="muted">Loading FAQs...</p>
      </div>
    </div>

    <!-- Search Section -->
    <div id="search-section" class="content-section hidden">
      <h2>Search FAQs</h2>
      <input type="text" id="search-input" class="search-box" placeholder="Search questions and answers...">
      <div class="faq-list" id="search-results">
        <p class="muted">Enter a search term to find FAQs</p>
      </div>
    </div>

    <!-- Admin Panel Section -->
    <div id="admin-section" class="content-section hidden">
      <h2>Admin Panel</h2>
      <div class="dashboard-nav">
        <button id="admin-users" class="nav-button">Manage Users</button>
        <button id="admin-categories" class="nav-button">Manage Categories</button>
        <button id="admin-audit" class="nav-button">Audit Log</button>
      </div>
      <div id="admin-content">
        <p class="muted">Select an admin function above</p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/faq.js"></script>
  <script>
    let currentUser = null;
    let currentSection = 'overview';

    async function init() {
      const token = localStorage.getItem('token');
      if (!token) return window.location.href = 'login.html';
      
      const me = await meReq(token);
      if (!me || !me.user) {
        localStorage.removeItem('token');
        return window.location.href = 'login.html';
      }
      
      currentUser = me.user;
      document.getElementById('welcome').textContent = `Welcome, ${currentUser.name}`;
      
      // Set role badge
      const roleBadge = document.getElementById('role-badge');
      roleBadge.textContent = currentUser.role.toUpperCase();
      roleBadge.className = `role-badge role-${currentUser.role}`;
      
      // Show/hide admin features
      if (currentUser.role === 'admin') {
        document.getElementById('nav-admin').classList.remove('hidden');
        document.getElementById('create-faq-btn').classList.remove('hidden');
      }
      
      if (currentUser.role === 'editor') {
        document.getElementById('create-faq-btn').classList.remove('hidden');
      }
      
      // Load initial data
      await loadOverview();
      setupEventListeners();
    }

    function setupEventListeners() {
      // Navigation
      document.getElementById('nav-overview').addEventListener('click', () => showSection('overview'));
      document.getElementById('nav-faqs').addEventListener('click', () => showSection('faqs'));
      document.getElementById('nav-search').addEventListener('click', () => showSection('search'));
      document.getElementById('nav-admin').addEventListener('click', () => showSection('admin'));
      
      // Admin navigation
      document.getElementById('admin-users').addEventListener('click', () => loadAdminUsers());
      document.getElementById('admin-categories').addEventListener('click', () => loadAdminCategories());
      document.getElementById('admin-audit').addEventListener('click', () => loadAdminAudit());
      
      // FAQ management
      document.getElementById('create-faq-btn').addEventListener('click', () => createFAQ());
      document.getElementById('search-input').addEventListener('input', debounce(performSearch, 300));
      
      // Logout
      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      });
    }

    function showSection(section) {
      // Hide all sections
      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-button').forEach(el => el.classList.remove('active'));
      
      // Show selected section
      document.getElementById(`${section}-section`).classList.remove('hidden');
      document.getElementById(`nav-${section}`).classList.add('active');
      
      currentSection = section;
      
      // Load section-specific data
      if (section === 'faqs') loadFAQs();
      if (section === 'search') document.getElementById('search-results').innerHTML = '<p class="muted">Enter a search term to find FAQs</p>';
    }

    async function loadOverview() {
      try {
        const response = await fetch('/api/faq/stats/overview', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        if (response.ok) {
          const data = await response.json();
          const stats = data.stats;
          
          document.getElementById('total-faqs').textContent = stats.total_faqs || 0;
          document.getElementById('published-faqs').textContent = stats.published_faqs || 0;
          document.getElementById('draft-faqs').textContent = stats.draft_faqs || 0;
          document.getElementById('total-views').textContent = stats.total_views || 0;
        }
      } catch (error) {
        console.error('Error loading overview:', error);
      }
    }

    async function loadFAQs() {
      try {
        const response = await fetch('/api/faq', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        if (response.ok) {
          const data = await response.json();
          displayFAQs(data.faqs);
        }
      } catch (error) {
        console.error('Error loading FAQs:', error);
        document.getElementById('faq-list').innerHTML = '<p class="muted">Error loading FAQs</p>';
      }
    }

    function displayFAQs(faqs) {
      const container = document.getElementById('faq-list');
      
      if (faqs.length === 0) {
        container.innerHTML = '<p class="muted">No FAQs found</p>';
        return;
      }
      
      container.innerHTML = faqs.map(faq => `
        <div class="faq-item">
          <div class="faq-question">${faq.question}</div>
          <div class="faq-answer">${faq.answer.substring(0, 100)}${faq.answer.length > 100 ? '...' : ''}</div>
          <div class="faq-meta">
            <span>Category: ${faq.category_name || 'Uncategorized'}</span>
            <span>Status: ${faq.status}</span>
            <span>Views: ${faq.view_count}</span>
            <span>Author: ${faq.author_name}</span>
          </div>
          <div class="faq-actions">
            <button class="btn-small nav-button" onclick="viewFAQ(${faq.id})">View</button>
            ${canEdit(faq) ? `<button class="btn-small nav-button secondary" onclick="editFAQ(${faq.id})">Edit</button>` : ''}
            ${canDelete(faq) ? `<button class="btn-small nav-button secondary" onclick="deleteFAQ(${faq.id})">Delete</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function canEdit(faq) {
      return currentUser.role === 'admin' || (currentUser.role === 'editor' && faq.author_id === currentUser.id);
    }

    function canDelete(faq) {
      return currentUser.role === 'admin';
    }

    async function performSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) {
        document.getElementById('search-results').innerHTML = '<p class="muted">Enter a search term to find FAQs</p>';
        return;
      }
      
      try {
        // Use localhost:3000 if opened as file://, otherwise use current origin
        const API_BASE = (window && window.location && window.location.protocol === 'file:') 
          ? 'http://localhost:3000' 
          : (window && window.location && window.location.origin) ? window.location.origin : 'http://localhost:3000';
        
        const response = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}`, {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        
        if (response.ok) {
          const data = await response.json();
          displaySearchResults(data.results);
        } else {
          throw new Error('Search request failed');
        }
      } catch (error) {
        console.error('Error searching FAQs:', error);
        document.getElementById('search-results').innerHTML = '<p class="muted">Error searching FAQs</p>';
      }
    }

    function displaySearchResults(results) {
      const container = document.getElementById('search-results');
      
      if (!results || results.length === 0) {
        container.innerHTML = '<p class="muted">No FAQs found matching your search</p>';
        return;
      }
      
      container.innerHTML = results.map(item => `
        <div class="faq-item">
          <div class="faq-question">${item.question}</div>
          <div class="faq-answer">${item.answer.substring(0, 150)}${item.answer.length > 150 ? '...' : ''}</div>
          <div class="faq-meta">
            <span>ID: ${item.id}</span>
            <span>Relevance: ${item.score ? item.score.toFixed(2) : 'N/A'}</span>
            <span>Created: ${new Date(item.created_at).toLocaleDateString()}</span>
          </div>
        </div>
      `).join('');
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Placeholder functions for FAQ management
    function createFAQ() {
      alert('Create FAQ functionality will be implemented');
    }

    function viewFAQ(id) {
      alert(`View FAQ ${id} functionality will be implemented`);
    }

    function editFAQ(id) {
      alert(`Edit FAQ ${id} functionality will be implemented`);
    }

    function deleteFAQ(id) {
      if (confirm('Are you sure you want to delete this FAQ?')) {
        alert(`Delete FAQ ${id} functionality will be implemented`);
      }
    }

    // Admin functions
    function loadAdminUsers() {
      document.getElementById('admin-content').innerHTML = '<p class="muted">User management will be implemented</p>';
    }

    function loadAdminCategories() {
      document.getElementById('admin-content').innerHTML = '<p class="muted">Category management will be implemented</p>';
    }

    function loadAdminAudit() {
      document.getElementById('admin-content').innerHTML = '<p class="muted">Audit log will be implemented</p>';
    }

    init();
  </script>
</body>
</html>
