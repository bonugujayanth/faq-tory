<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FAQ-tory</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-split">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Login — User</h1>
                    <p>Sign in to your user account</p>
                </div>

                <form id="loginUserForm">
                    <div class="form-group">
                        <label for="emailUser">Email address</label>
                        <input type="email" id="emailUser" name="email" class="form-control" required placeholder="Enter your email">
                        <div class="error-message">Please enter a valid email address</div>
                    </div>

                    <div class="form-group">
                        <label for="passwordUser">Password</label>
                        <input type="password" id="passwordUser" name="password" class="form-control" required placeholder="Enter your password">
                        <div class="error-message">Password is required</div>
                    </div>

                    <button type="submit" class="auth-button" id="loginUserButton">
                        Sign in as user
                    </button>
                    <p id="msgUser" class="error-message" style="text-align: center; margin-top: 12px;"></p>
                </form>
            </div>

            <div class="auth-card">
                <div class="auth-header">
                    <h1>Login — Admin</h1>
                    <p>Sign in to your admin account</p>
                </div>

                <form id="loginAdminForm">
                    <div class="form-group">
                        <label for="emailAdmin">Email address</label>
                        <input type="email" id="emailAdmin" name="email" class="form-control" required placeholder="Enter your email">
                        <div class="error-message">Please enter a valid email address</div>
                    </div>

                    <div class="form-group">
                        <label for="passwordAdmin">Password</label>
                        <input type="password" id="passwordAdmin" name="password" class="form-control" required placeholder="Enter your password">
                        <div class="error-message">Password is required</div>
                    </div>

                    <button type="submit" class="auth-button" id="loginAdminButton">
                        Sign in as admin
                    </button>
                    <p id="msgAdmin" class="error-message" style="text-align: center; margin-top: 12px;"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        function wireLogin(formId, btnId, msgId) {
            const form = document.getElementById(formId);
            const button = document.getElementById(btnId);
            const message = document.getElementById(msgId);

            const emailInput = form.querySelector('input[name="email"]');
            const passwordInput = form.querySelector('input[name="password"]');

            const validate = () => {
                const eg = emailInput.parentElement; eg.classList.toggle('error', !emailInput.value);
                const pg = passwordInput.parentElement; pg.classList.toggle('error', !passwordInput.value);
            };
            emailInput.addEventListener('input', validate);
            passwordInput.addEventListener('input', validate);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = { email: emailInput.value, password: passwordInput.value };
                button.disabled = true; button.textContent = 'Signing in...'; message.style.display = 'none';
                try {
                    const res = await login(data);
                    if (res && res.token) {
                        message.textContent = 'Logged in successfully! Redirecting...';
                        message.style.color = 'var(--success)';
                        message.style.display = 'block';
                        localStorage.setItem('token', res.token);
                        const role = (res.user && res.user.role) || 'viewer';
                        setTimeout(() => {
                            if (role === 'admin') {
                                window.location.href = 'admin/dashboard.html';
                            } else {
                                window.location.href = 'dashboard.html';
                            }
                        }, 800);
                    } else {
                        throw new Error((res && (res.message || res.error)) || 'Login failed');
                    }
                } catch (err) {
                    message.textContent = err.message; message.style.display = 'block';
                    button.disabled = false; button.textContent = formId.includes('Admin') ? 'Sign in as admin' : 'Sign in as user';
                }
            });
        }

        wireLogin('loginUserForm', 'loginUserButton', 'msgUser');
        wireLogin('loginAdminForm', 'loginAdminButton', 'msgAdmin');
    </script>
</body>
</html>
