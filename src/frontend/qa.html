<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q/A Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Q/A Management</h1>
      
      <!-- Q/A Creation Form -->
      <div class="form-section">
        <h2>Create New Q/A Entry</h2>
        <form id="qaForm">
          <div class="form-group">
            <label for="question">Question:</label>
            <textarea id="question" name="question" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="answer">Answer:</label>
            <textarea id="answer" name="answer" required></textarea>
          </div>
          
          <button type="submit" class="btn primary">Create Q/A Entry</button>
        </form>
      </div>

      <!-- Q/A Listing -->
      <div class="listing-section">
        <h2>Q/A Entries</h2>
        <div id="qaList">
          <!-- Q/A entries will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal Template -->
  <template id="editModalTemplate">
    <div class="modal">
      <div class="modal-content">
        <h2>Edit Q/A Entry</h2>
        <form id="editForm">
          <div class="form-group">
            <label for="editQuestion">Question:</label>
            <textarea id="editQuestion" name="question" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="editAnswer">Answer:</label>
            <textarea id="editAnswer" name="answer" required></textarea>
          </div>
          
          <div class="button-group">
            <button type="submit" class="btn primary">Update</button>
            <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="js/qa.js"></script>
</body>
</html>
