<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q/A Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-btn {
      background: #6b7280;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover {
      background: #4b5563;
    }
    .form-section, .listing-section {
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-group textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-family: inherit;
      resize: vertical;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn.primary {
      background: #3b82f6;
      color: white;
    }
    .btn.primary:hover {
      background: #2563eb;
    }
    .btn.secondary {
      background: #6b7280;
      color: white;
      margin-right: 5px;
    }
    .btn.secondary:hover {
      background: #4b5563;
    }
    .btn.danger {
      background: #ef4444;
      color: white;
    }
    .btn.danger:hover {
      background: #dc2626;
    }
    .qa-entry {
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #e5e7eb;
    }
    .qa-entry h3 {
      margin: 0 0 10px 0;
      color: #1f2937;
    }
    .qa-entry p {
      margin: 0 0 10px 0;
      color: #4b5563;
      line-height: 1.6;
    }
    .qa-meta {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      color: #6b7280;
      font-size: 0.85em;
    }
    .qa-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
    }
    .modal-content h2 {
      margin-top: 0;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 2000;
      animation: slideIn 0.3s ease;
    }
    .notification.success {
      border-left: 4px solid #10b981;
      color: #065f46;
    }
    .notification.error {
      border-left: 4px solid #ef4444;
      color: #991b1b;
    }
    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <h1>Q/A Management</h1>
        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
      </div>
      
      <!-- Q/A Creation Form -->
      <div class="form-section">
        <h2>Create New Q/A Entry</h2>
        <form id="qaForm">
          <div class="form-group">
            <label for="question">Question:</label>
            <textarea id="question" name="question" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="answer">Answer:</label>
            <textarea id="answer" name="answer" required></textarea>
          </div>
          
          <button type="submit" class="btn primary">Create Q/A Entry</button>
        </form>
      </div>

      <!-- Q/A Listing -->
      <div class="listing-section">
        <h2>Q/A Entries</h2>
        <div id="qaList">
          <!-- Q/A entries will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal Template -->
  <template id="editModalTemplate">
    <div class="modal">
      <div class="modal-content">
        <h2>Edit Q/A Entry</h2>
        <form id="editForm">
          <div class="form-group">
            <label for="editQuestion">Question:</label>
            <textarea id="editQuestion" name="question" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="editAnswer">Answer:</label>
            <textarea id="editAnswer" name="answer" required></textarea>
          </div>
          
          <div class="button-group">
            <button type="submit" class="btn primary">Update</button>
            <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="js/qa.js"></script>
</body>
</html>
