<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signup</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top-row">
        <h1>Sign up</h1>
        <a class="link" href="login.html">Sign in</a>
      </div>
      <form id="signupForm">
        <label>Name</label>
        <input name="name" required />
        <label>Email</label>
        <input name="email" type="email" required />
        <label>Password</label>
        <input name="password" type="password" required />
        <div style="height:12px"></div>
        <button type="submit">Create account</button>
      </form>
      <p id="msg" class="muted footer"></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = { name: form.name.value, email: form.email.value, password: form.password.value };
      const res = await signup(data);
      const msg = document.getElementById('msg');
      if (res.ok) {
        msg.textContent = 'Signed up. You can now log in.';
        setTimeout(() => window.location.href = 'login.html', 1000);
      } else {
        msg.textContent = res.error || 'Signup failed';
      }
    });
  </script>
</body>
</html>
