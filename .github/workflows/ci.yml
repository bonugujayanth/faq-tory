name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd src/backend
          npm ci

      - name: Run ESLint
        run: |
          cd src/backend
          npm run lint

      - name: Run tests with coverage
        run: |
          cd src/backend
          npm run test:coverage

      - name: Run npm audit
        run: |
          cd src/backend
          npm audit

      - name: Create artifact
        run: |
          cd src/backend
          zip -r ../../build.zip . -x "node_modules/*" "coverage/*" ".git/*"

      - name: Upload test coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: src/backend/coverage

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: build.zip