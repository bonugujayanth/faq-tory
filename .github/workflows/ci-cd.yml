name: CI-CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd src/backend
          npm ci

      - name: Run linting
        run: |
          cd src/backend
          if [ -f package.json ] && npm list --depth=0 | grep -q eslint; then
            npm run lint
          else
            echo "No linting configured, skipping..."
          fi

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and run tests
        run: |
          cd src/backend
          npm ci
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd src/backend
          npm ci

      - name: Build application
        run: |
          cd src/backend
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No build script found, skipping..."
          fi

      - name: Security audit
        run: |
          cd src/backend
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo "No package.json found, skipping security audit"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
      - name: Run integration tests
        run: echo "Running integration tests..."
      - name: Deploy to production
        run: echo "Deploying to production environment..."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
      - name: Run integration tests
        run: echo "Running integration tests..."
      - name: Deploy to production
        run: echo "Deploying to production environment..."
      - name: Deploy to production

