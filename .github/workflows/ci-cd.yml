name: CI-CD Pipeline

on:
  push:
    branches: 
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd src/backend
          npm install
        continue-on-error: false

      - name: Run linting
        run: |
          cd src/backend
          npm run lint || echo "Linting not configured or failed"
        continue-on-error: true

      - name: Run tests
        run: |
          cd src/backend
          npm test
        continue-on-error: false

      - name: Generate coverage report
        run: |
          cd src/backend
          npm test -- --coverage --coverageReporters="text" --coverageReporters="text-summary"
        continue-on-error: true

      - name: Build application
        run: |
          cd src/backend
          npm run build --if-present || echo "No build script found"
        continue-on-error: true

      - name: Security audit
        run: |
          cd src/backend
          npm audit --audit-level=moderate || echo "Security vulnerabilities found (non-blocking)"
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
        
      - name: Run integration tests
        run: echo "Running integration tests..."
        
      - name: Deploy to production
        run: echo "Deploying to production environment..."
